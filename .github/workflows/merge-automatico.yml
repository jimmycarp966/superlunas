name: Merge automático con revisión

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["Controles para merge", "Revisión de PR", "Guardado offline de cajas"]
    types: [completed]
  status:
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "PR a evaluar; vacío evalúa los abiertos"
        type: string
        required: false
      release_only:
        description: "Reintentar solo el despacho de SQL de un PR ya integrado"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: merge-automatico
  cancel-in-progress: false

jobs:
  evaluar:
    name: Evaluar e integrar
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: write
      statuses: read
      actions: read
    steps:
      - name: Leer solamente la política de la rama principal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/auto-merge
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verificar y mergear únicamente el commit autorizado
        run: node .github/auto-merge/run.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE_PAUSED: ${{ vars.AUTO_MERGE_PAUSED }}
